services:
  obscura:
    image: h4ckf0r0day/obscura
    command: ["serve", "--port", "9222", "--workers", "2"]
    network_mode: host
    restart: unless-stopped

  # Playwright Chromium — real Chrome with BoringSSL TLS stack.
  # Use this when targets have aggressive WAF (Akamai, Cloudflare)
  # that blocks Obscura's rustls fingerprint.
  # Launch:  docker compose up -d playwright
  # Then:    BROWSER=playwright docker compose run --rm recon /scope/target.txt
  playwright:
    image: zenika/alpine-chrome:124
    command:
      - --no-sandbox
      - --headless
      - --disable-gpu
      - --disable-dev-shm-usage
      - --disable-background-timer-throttling
      - --disable-backgrounding-occluded-windows
      - --disable-renderer-backgrounding
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9223
      - about:blank
    network_mode: host
    restart: unless-stopped
    profiles:
      - playwright

  recon:
    build: .
    working_dir: /app
    depends_on:
      - obscura
    env_file: .env
    network_mode: host
    volumes:
      - ./scope:/scope:ro
      - ./data:/data

  # Nuclei scan through Chrome CDP proxy — WAF bypass.
  # Run AFTER recon has finished. Uses the latest recon data.
  # Usage:
  #   docker compose run --rm -e BROWSER=chrome -e BROWSER_WS="$ws" \
  #     nuclei-scan /scope/target.txt program-name
  nuclei-scan:
    build: .
    working_dir: /app
    entrypoint: ["bash", "/app/scripts/nuclei_scan.sh"]
    env_file: .env
    network_mode: host
    volumes:
      - ./scope:/scope:ro
      - ./data:/data
